<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aditi's Wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#a90d12;--paper:#f4f0e8;--ink:#171313;--white:#fff;--ease:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#090909;font-family:Manrope,sans-serif}
body{touch-action:pan-y}
#app{position:relative;width:100%;height:100dvh;min-height:100%;overflow:hidden;background:#f4f0e8 url('images/background.jpg') center/cover no-repeat;color:var(--ink)}
#app:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.08);pointer-events:none;z-index:1}
.status{position:absolute;top:0;left:0;right:0;height:48px;padding:14px 22px 0;display:flex;align-items:flex-start;justify-content:space-between;color:#fff;font-size:14px;font-weight:800;z-index:30;text-shadow:0 1px 4px #0006}
.status-right{display:flex;gap:8px;align-items:center}.wifi{font-size:15px}.battery{width:22px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#fff;border-radius:1px}.battery i{display:block;height:100%;width:78%;background:#fff;border-radius:1px}
.progress-row{position:absolute;top:51px;left:18px;right:18px;display:flex;gap:6px;z-index:30}.progress-track{height:3px;flex:1;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden}.progress-fill{height:100%;width:0;background:#fff;border-radius:9px}.progress-track.done .progress-fill{width:100%}.progress-track.active .progress-fill{animation:fill var(--duration,5200ms) linear forwards}@keyframes fill{to{width:100%}}
.slides{position:absolute;inset:0;z-index:5}.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:92px 24px 72px;opacity:0;transform:translateX(35px);transition:opacity .5s var(--ease),transform .5s var(--ease);pointer-events:none}.slide.current{opacity:1;transform:none;pointer-events:auto}.slide.exit{opacity:0;transform:translateX(-35px)}
.paper{background:rgba(250,247,240,.93);border-radius:28px;padding:28px 22px 30px;box-shadow:0 20px 50px #0003;position:relative;overflow:hidden}.paper:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.05));pointer-events:none}
.photo-wrap{width:min(68vw,300px);aspect-ratio:1/1;margin:0 auto 24px;border:4px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 12px 30px #0004;background:#ddd;opacity:0;transform:translateY(16px) scale(.96)}.photo-wrap img{width:100%;height:100%;display:block;object-fit:cover}.slide.current .photo-wrap{animation:rise .7s var(--ease) .08s forwards}@keyframes rise{to{opacity:1;transform:none}}
.eyebrow{font-size:16px;font-weight:800;color:var(--red);margin-bottom:9px;opacity:0;transform:translateY(10px)}.headline{font-family:Unbounded,sans-serif;font-size:clamp(39px,10vw,70px);line-height:1.03;font-weight:800;letter-spacing:-.045em;color:var(--red);opacity:0;transform:translateY(14px)}.sub{margin:18px auto 0;max-width:430px;font-size:17px;line-height:1.45;color:#211d1d;opacity:0;transform:translateY(10px)}.slide.current .eyebrow{animation:rise .55s var(--ease) .2s forwards}.slide.current .headline{animation:rise .65s var(--ease) .3s forwards}.slide.current .sub{animation:rise .6s var(--ease) .45s forwards}
.tags{display:grid;gap:12px;margin-top:25px}.tag{padding:15px 16px;border-radius:18px;background:var(--red);color:#fff;font-weight:800;font-size:18px;opacity:0;transform:translateY(12px)}.slide.current .tag:nth-child(1){animation:rise .5s var(--ease) .5s forwards}.slide.current .tag:nth-child(2){animation:rise .5s var(--ease) .65s forwards}.slide.current .tag:nth-child(3){animation:rise .5s var(--ease) .8s forwards}
.deco{position:absolute;z-index:2;color:#fff;opacity:.95;filter:drop-shadow(0 4px 6px #0002);font-size:34px}.star1{top:17%;left:9%;transform:rotate(-14deg)}.star2{top:28%;right:8%;transform:rotate(17deg)}.star3{bottom:20%;left:12%;transform:rotate(8deg)}
.hint{position:absolute;bottom:34px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:14px;z-index:30;text-shadow:0 1px 5px #0008;animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}
.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:9px;background:#fff;z-index:31}.tap-zone{position:absolute;top:0;bottom:0;width:42%;z-index:25}.tap-zone.left{left:0}.tap-zone.right{right:0}
@media(min-width:700px){#app{max-width:500px;margin:auto}body{display:grid;place-items:center;background:#111}#app{height:min(100dvh,1000px);border-radius:0;box-shadow:0 0 80px #0009}}
@media(max-width:699px){.paper{background:rgba(250,247,240,.9);padding:24px 18px}.headline{font-size:clamp(38px,11vw,60px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<div id="app">
<div class="status"><span id="time">9:41</span><span class="status-right"><span>▮▮▮</span><span class="wifi">⌁</span><span class="battery"><i></i></span></span></div>
<div class="progress-row" id="progressRow"></div>
<div class="slides" id="slides"></div>
<div class="deco star1">★</div><div class="deco star2">★</div><div class="deco star3">★</div>
<div class="hint" id="hint">tap to continue →</div><div class="home"></div>
<div class="tap-zone left" id="left"></div><div class="tap-zone right" id="right"></div>
</div>
<script>
const CONFIG={slideDuration:5200,backgroundImage:'images/background.jpg',slides:[
{type:'intro',eyebrow:"Aditi's",title:'2026 Wrapped',subtitle:'Your year, unwrapped just for you.',image:'images/1.png'},
{type:'tags',eyebrow:'Your dominant energy this year',title:'Your vibe, officially confirmed',tags:['chaotic good energy','desi girl vibe','baddie queen energy'],image:'images/2.png'},
{type:'stat',eyebrow:'Your #1, no contest',title:'Pani Puri',subtitle:'Undefeated. Ordered on sight, every single time.',image:'images/3.png'},
{type:'stat',eyebrow:'On repeat all year',title:'Desi Bollywood Songs',subtitle:'In every mood, for every scene, at full volume.',image:'images/4.png'},
{type:'stat',eyebrow:'Where your heart already is',title:'Udaipur',subtitle:"City of Lakes. One of these years, we're actually going."},
{type:'closing',title:'Happy birthday, Aditi',message:'This is just a small wrap-up of your year — the real gift is everything still to come. So excited to celebrate you today.\n\nLove you lots.'}
]};
const slides=document.getElementById('slides'),row=document.getElementById('progressRow'),hint=document.getElementById('hint');let current=0,timer;
function slideHTML(s,i){let content='';const photo=s.image?`<div class="photo-wrap"><img src="${s.image}" alt=""></div>`:'';if(s.type==='intro'||s.type==='stat')content=`<div class="paper">${photo}<div class="eyebrow">${s.eyebrow||''}</div><div class="headline">${s.title}</div><div class="sub">${s.subtitle||''}</div></div>`;if(s.type==='tags')content=`<div class="paper">${photo}<div class="eyebrow">${s.eyebrow}</div><div class="headline" style="font-size:clamp(28px,7.5vw,48px)">${s.title}</div><div class="tags">${s.tags.map(x=>`<div class="tag">${x}</div>`).join('')}</div></div>`;if(s.type==='closing')content=`<div class="paper"><div style="font-size:30px;margin-bottom:14px;color:#a90d12">♥ ♥ ♥</div><div class="headline" style="font-size:clamp(31px,8vw,50px)">${s.title}</div>${s.message.split('\n').filter(Boolean).map(x=>`<div class="sub" style="margin-top:14px">${x}</div>`).join('')}<div class="cta" style="margin-top:25px;color:#fff;background:#a90d12;border-radius:999px;padding:11px 18px;font-weight:800;display:inline-block">made with love, just for you</div></div>`;return `<section class="slide" data-index="${i}">${content}</section>`}
function render(){slides.innerHTML=CONFIG.slides.map(slideHTML).join('');row.innerHTML=CONFIG.slides.map(()=>'<div class="progress-track"><div class="progress-fill"></div></div>').join('');goTo(0)}
function goTo(n){if(n<0||n>=CONFIG.slides.length)return;current=n;document.querySelectorAll('.slide').forEach((x,i)=>{x.classList.remove('current','exit');if(i===n)x.classList.add('current');else if(i<n)x.classList.add('exit')});document.querySelectorAll('.progress-track').forEach((x,i)=>{x.classList.remove('active','done');if(i<n)x.classList.add('done');if(i===n)x.classList.add('active')});hint.style.display=n===CONFIG.slides.length-1?'none':'block';clearTimeout(timer);if(n<CONFIG.slides.length-1)timer=setTimeout(next,CONFIG.slideDuration)}
function next(){if(current<CONFIG.slides.length-1)goTo(current+1)}function prev(){if(current>0)goTo(current-1)}
right.onclick=next;left.onclick=prev;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')prev()});let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)(dx<0?next:prev)()},{passive:true});
function updateTime(){const d=new Date();document.getElementById('time').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(' AM','').replace(' PM','')}updateTime();setInterval(updateTime,30000);render();
</script>
</body>
</html>
